name: Build Android AAB for Sivaprasad Super Mart

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          yes | bubblewrap init --manifest=https://gsps44805-design.github.io/Sivaprasad-Super-Mart/manifest.json --directory=./twa-app

      - name: Build signed AAB
        run: |
          cd twa-app
          bubblewrap build

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sivaprasad-super-mart-aab
          path: twa-app/app-release-bundle.aab
