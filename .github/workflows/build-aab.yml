name: Build Android AAB for Sivaprasad

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Ensure icon-512.png exists locally
        run: |
          if [ ! -f ./icon-512.png ]; then
            python3 -c "import base64; data = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='); open('icon-512.png', 'wb').write(data)"
          fi

      - name: Generate Keystore if missing
        run: |
          if [ ! -f ./android.keystore ]; then
            keytool -genkeypair -v -keystore ./android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Sivaprasad, OU=SuperMart, O=SivaprasadSuperMart, L=Kadapa, ST=AndhraPradesh, C=IN"
          fi

      - name: Build Android AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
        run: |
          set -e
          printf "y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n" | bubblewrap build --skipPwaValidation --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Upload AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: "**/*.aab"
