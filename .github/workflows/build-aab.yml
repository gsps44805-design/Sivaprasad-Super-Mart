name: Build Android AAB for Sivaprasad

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Update project & Build AAB
        run: |
          set -e
          yes "y" | bubblewrap update --manifest=./twa-manifest.json --skipPwaValidation || true
          yes "y" | bubblewrap build --skipPwaValidation

      - name: Upload AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: "**/*.aab"
