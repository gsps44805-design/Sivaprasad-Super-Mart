name: Build Android AAB for Sivaprasad

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Ensure minSdkVersion is 24 in twa-manifest.json
        run: |
          python3 -c "
          import json
          with open('twa-manifest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['minSdkVersion'] = 24
          with open('twa-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          print('Updated minSdkVersion to 24')
          "

      - name: Prepare local icon and serve over HTTP
        run: |
          if [ ! -f ./icon-512.png ]; then
            python3 -c "import base64; data = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='); open('icon-512.png', 'wb').write(data)"
          fi
          nohup python3 -m http.server 8765 --directory . >/tmp/http.log 2>&1 &
          sleep 2

      - name: Generate Keystore if missing
        run: |
          if [ ! -f ./android.keystore ]; then
            keytool -genkeypair -v -keystore ./android.keystore -alias android -keyalg RSA -keysize 4096 -validity 20000 -storepass android123 -keypass android123 -dname "CN=Sivaprasad, OU=SuperMart, O=SivaprasadSuperMart, L=Kadapa, ST=AndhraPradesh, C=IN"
          fi

      - name: Build Android AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
        run: |
          set -e
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$HOME/.bubblewrap/android_sdk"
          yes | bubblewrap build --skipPwaValidation --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Upload AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: "**/*.aab"
